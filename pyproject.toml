[project]
name = "podpub"
version = "0.1.0"
description = "Dicepunk / d2 Дідів — podcast publishing pipeline"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "openai>=1.40",            # для provider=whisper_api
    "fastapi>=0.115",          # веб-інтерфейс (podpub web)
    "uvicorn>=0.30",
    "python-multipart>=0.0.9", # завантаження аудіо через інтерфейс
]
# Опційно (важкі / за потреби, встанови окремо):
#   faster-whisper>=1.0       # provider=faster_whisper_local
#   pillow                    # генерація placeholder-фону

[project.scripts]
podpub = "podpub.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
