<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>podpub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23b8452a'/%3E%3Cpath d='M16 7l8 5v8l-8 5-8-5v-8z' fill='none' stroke='%23fff7f2' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark">podpub</span>
      <span class="brand-sub">Dicepunk · d2 Дідів</span>
    </a>
    <div id="job-pill"></div>
  </header>

  <main id="main" class="wrap" tabindex="-1">
    <p class="loading">Завантаження…</p>
  </main>

  <dialog id="dlg" aria-labelledby="dlg-title">
    <form method="dialog">
      <h2 id="dlg-title"></h2>
      <div id="dlg-body"></div>
      <div class="dlg-actions">
        <button value="cancel" class="btn ghost">Скасувати</button>
        <button value="ok" id="dlg-ok" class="btn primary">Так</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
